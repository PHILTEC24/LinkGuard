services:
  # ---------------------------------------------------------
  # 1. Django Backend API (Web Service)
  # ---------------------------------------------------------
  - type: web
    name: linkguard-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "python manage.py migrate && gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: linkguard-db
          property: connectionString
      - key: PROVIDERS_ENABLED
        value: "safe_browsing,virustotal,urlhaus,phishtank,dns_rdap"
      - key: PROVIDER_TIMEOUT
        value: "6"
      - key: ALLOW_DIRECT_PROBE
        value: "0"

  # ---------------------------------------------------------
  # 2. React + Vite Frontend (Static Site via CDN)
  # ---------------------------------------------------------
  - type: web
    name: linkguard-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: VITE_API_URL
        fromService:
          type: web
          name: linkguard-backend
          envVarKey: RENDER_EXTERNAL_URL

# ---------------------------------------------------------
# 3. PostgreSQL Database
# ---------------------------------------------------------
databases:
  - name: linkguard-db
    databaseName: linkguard
    user: linkguard
    plan: free
